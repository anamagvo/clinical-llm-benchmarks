output_dir: results
scenarios_dir: scenarios
repetitions: 100
warmup_repetitions: 5
models:
  # Local Ollama models
  - name: llama3.1-local
    type: ollama
    model: llama3.1:latest
    base_url: http://127.0.0.1:11434
    timeout: [10, 300]
    format: json
    options: {temperature: 0}
    
  - name: qwen3-local
    type: ollama
    model: qwen3:4b
    base_url: http://127.0.0.1:11434
    timeout: [10, 300]
    format: json
    options: {temperature: 0}
    
  # Remote server models - using the same endpoint structure as working URL (note: this is only for local setup and would need to be changed according to model endpoints on the actual remote server)
  - name: qwen3-remote
    type: ollama
    model: qwen3:14b
    base_url: http://192.168.178.50:3000
    timeout: [10, 300]
    format: json
    options: {temperature: 0}
