[project]
name = "clinical-llm-benchmark"
version = "0.2.0"
description = "Docker-based benchmark for local LLMs simulating German clinical patient-intake dialogues"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.31",
    "jinja2>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.scripts]
benchmark = "benchmark.run:main"
evaluate-results = "benchmark.evaluate_cli:main"
generate-report = "benchmark.report:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["benchmark", "model_adapters"]
