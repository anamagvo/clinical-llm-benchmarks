services:
  benchmark:
    build: .
    depends_on:
      - ollama
    environment:
      MODEL_API_KEY: ${MODEL_API_KEY:-}
    volumes:
      - ./results:/app/results
      - ./scenarios:/app/scenarios
      - ./config_with_docker.yaml:/app/config.yaml
      - ./run_benchmark.py:/app/run_benchmark.py:ro
      - ./benchmark:/app/benchmark:ro
      - ./model_adapters:/app/model_adapters:ro
  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: [ollama:/root/.ollama]
    mem_limit: 12g
    shm_size: "2gb"
    cpus: 2.0
volumes:
  ollama:
